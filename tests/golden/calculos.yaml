- id: F2-10
  descricao: interpolação linear
  expr: "interp([0, 10], [0, 100], 2.5)"
  esperado: {valor: 25}
- id: F2-10
  descricao: determinante
  expr: "det([[1, 2], [3, 4]])"
  esperado: {valor: -2}

# --- verificações ---
- id: F2-14
  descricao: aprovado com folga
  verificar: "0.82 / 100 < 2 %"
  esperado: {estado: ok, texto: "0,82 %"}
- id: F2-14
  descricao: atenção perto do limite
  verificar: "0.82 / 100 < 1 %"
  esperado: {estado: warn}
- id: F2-14
  descricao: reprovado
  verificar: "0.82 / 100 < 0.5 %"
  esperado: {estado: fail}

# --- regra do selo (pedido do usuário ao fechar a fase 3) ---
# razão de uso: < e <= : r = valor/limite; > e >= : r = limite/valor. ATENÇÃO se a condição vale e r >= 1 - margem.
- id: F3-08
  descricao: "< com r = 0,85 (margem padrão 20 %): ATENÇÃO"
  verificar: "0.85 < 1"
  esperado: {estado: warn}
- id: F3-08
  descricao: "< com r = 0,7: APROVADO"
  verificar: "0.7 < 1"
  esperado: {estado: ok}
- id: F3-08
  descricao: "<= exatamente em r = 0,8: ATENÇÃO"
  verificar: "0.8 <= 1"
  esperado: {estado: warn}
- id: F3-08
  descricao: "> com r = 10/12: ATENÇÃO"
  verificar: "12 A > 10 A"
  esperado: {estado: warn}
- id: F3-08
  descricao: "> com r = 10/30: APROVADO"
  verificar: "30 A > 10 A"
  esperado: {estado: ok}
- id: F3-08
  descricao: ">= com r = 0,8: ATENÇÃO"
  verificar: "12.5 A >= 10 A"
  esperado: {estado: warn}
- id: F3-08
  descricao: "condição falsa: REPROVADO"
  verificar: "5 A > 10 A"
  esperado: {estado: fail}
- id: F3-08
  descricao: "queda da string-3 (0,82 % de 1 %): ATENÇÃO"
  definicoes: ["ρ_cu := 0.0179 Ω*mm^2/m", "ΔV(L, I, S) := 2*ρ_cu*L*I/S"]
  verificar: "ΔV(32 m, 11.5 A, 4 mm^2)/(400 V) < 1 %"
  esperado: {estado: warn}
- id: F3-09
  descricao: "margem do config.yaml em 10 %: r = 0,85 vira APROVADO"
  margem: "10 %"
  verificar: "0.85 < 1"
  esperado: {estado: ok}
- id: F3-09
  descricao: "margem do config.yaml em 50 %: r = 0,6 vira ATENÇÃO"
  margem: "50 %"
  verificar: "0.6 < 1"
  esperado: {estado: warn}
- id: F3-10
  descricao: "atributo atencao=10% vence a margem padrão de 20 %"
  atencao: "10%"
  verificar: "0.85 < 1"
  esperado: {estado: ok}
- id: F3-10
  descricao: "atributo atencao=30% vence a margem do config.yaml (10 %)"
  margem: "10 %"
  atencao: "30%"
  verificar: "0.75 < 1"
  esperado: {estado: warn}
- id: F3-11
  descricao: "limite zero: nunca ATENÇÃO"
  verificar: "-0.1 V < 0 V"
  esperado: {estado: ok}
- id: F3-11
  descricao: "limite negativo: nunca ATENÇÃO"
  verificar: "-5 < -4"
  esperado: {estado: ok}
- id: F3-11
  descricao: "igualdade: só APROVADO ou REPROVADO"
  verificar: "2 m == 2 m"
  esperado: {estado: ok}
- id: F3-11
  descricao: "diferente: só APROVADO ou REPROVADO"
  verificar: "2 m ≠ 3 m"
  esperado: {estado: ok}
- id: F3-11
  descricao: "duas expressões variáveis (r = 0,95): nunca ATENÇÃO"
  definicoes: ["a := 9.5", "b := 10"]
  verificar: "a < b"
  esperado: {estado: ok}

# --- ADENDO 05: folha livre com a semântica do SMath (folha: true) ---
- id: E8-03
  descricao: "s_tensao := 10*x com x := 2 dá 20"
  folha: true
  definicoes: ["x := 2", "s_tensao := 10*x"]
  expr: "s_tensao"
  sem_unidade: true
  esperado: {valor: 20}
- id: E8-05
  descricao: definição com nome em aberto é resolvida na avaliação
  folha: true
  definicoes: ["s := 10*x", "x := 2"]
  expr: "s"
  sem_unidade: true
  esperado: {valor: 20}
- id: E8-05
  descricao: e com o valor que x tem no ponto da avaliação
  folha: true
  definicoes: ["s := 10*x", "x := 2", "x := 3"]
  expr: "s"
  sem_unidade: true
  esperado: {valor: 30}
- id: E8-06
  descricao: definição guarda o valor daquele ponto
  folha: true
  definicoes: ["x := 2", "s := 10*x", "x := 3"]
  expr: "s"
  sem_unidade: true
  esperado: {valor: 20}
- id: E8-07
  descricao: nome que nunca foi definido fica em aberto, sem erro
  folha: true
  definicoes: ["s := 10*x"]
  expr: "s"
  sem_unidade: true
  esperado: {simbolico: "10*x", faltando: [x]}
- id: E8-09
  descricao: "dois-pontos redefine um nome que já existe"
  folha: true
  definicoes: ["x := 2", "x := 3"]
  expr: "x"
  sem_unidade: true
  esperado: {valor: 3}
- id: E8-11
  descricao: "definição com resultado: Z_0 := sqrt(L/C) = ?"
  folha: true
  definicoes: ["L := 1.5*10^-3", "C := 0.01*10^-6", "Z_0 := sqrt(L/C) = ?"]
  linha: 2
  esperado: {valor: 387.3, texto: "387,30"}
- id: E8-12
  descricao: função do usuário
  folha: true
  definicoes: ["f(a, b) := a + b"]
  expr: "f(2, 3)"
  sem_unidade: true
  esperado: {valor: 5}
- id: E8-13
  descricao: redefinir usando o valor anterior
  folha: true
  definicoes: ["P_custo := 100", "p := 1.1", "P_custo := P_custo*p"]
  expr: "P_custo"
  sem_unidade: true
  esperado: {valor: 110}

